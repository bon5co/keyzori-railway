name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: server
            image: keyzori-railway
            tag: 2.0.3
          - context: postgres
            image: keyzori-postgres-railway
            tag: "18.0"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/${{ matrix.image }}:${{ matrix.tag }}
            ghcr.io/bon5co/${{ matrix.image }}:latest
